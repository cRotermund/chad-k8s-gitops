apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paprika-mcp-go
  namespace: chad-applications
  labels:
    app.kubernetes.io/name: paprika-mcp-go
    app.kubernetes.io/part-of: applications
  annotations:
    # The ExternalSecret CRD is owned by the external-secrets Application, so
    # it may not exist yet when this Application first syncs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: paprika-mcp-go
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
  data:
    - secretKey: MCP_TOKEN_SHA256
      remoteRef:
        key: /kubernetes/appsecrets/chad-applications/paprika-mcp-go/mcp-token-sha256
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: PAPRIKA_EMAIL
      remoteRef:
        key: /kubernetes/appsecrets/chad-applications/paprika-mcp-go/paprika-email
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: PAPRIKA_PASSWORD
      remoteRef:
        key: /kubernetes/appsecrets/chad-applications/paprika-mcp-go/paprika-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
