apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-aws-auth
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::471112535288:role/k3s-external-secrets-auth
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: aws-authentication
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-token-request
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: aws-authentication
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      - eso-aws-auth
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-token-request
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: aws-authentication
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-token-request
