apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: aws-parameter-store
spec:
  conditions:
    - namespaces:
        - chad-applications
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      role: arn:aws:iam::471112535288:role/k3s-ssm-parameter-read
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws-auth
            namespace: external-secrets
