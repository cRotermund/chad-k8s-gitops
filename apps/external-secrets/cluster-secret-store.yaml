apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: aws-parameter-store
  annotations:
    # The CRD ships in the same Application via the Helm chart, so it doesn't
    # exist when Argo CD first plans the sync. Apply this after the chart
    # (CRDs, controller, webhook) is healthy, and skip the dry run if the
    # CRD isn't registered yet.
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces:
        - chad-applications
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      role: arn:aws:iam::471112535288:role/k3s-ssm-parameter-read
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws-auth
            namespace: external-secrets
