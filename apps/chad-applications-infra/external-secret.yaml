apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: chad-applications
  labels:
    app.kubernetes.io/name: ghcr-pull-secret
    app.kubernetes.io/part-of: platform
  annotations:
    # The ExternalSecret CRD is owned by the external-secrets Application, so
    # it may not exist yet when this Application first syncs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: /kubernetes/appsecrets/chad-applications/ghcr/dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
