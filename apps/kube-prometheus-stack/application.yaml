apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  
  source:
    # Prometheus Community Helm chart - includes Prometheus, Grafana, and Alertmanager
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 89.2.1
    helm:
      values: |
        # Prometheus configuration
        prometheus:
          prometheusSpec:
            # Retention period for metrics
            retention: 30d
            # Storage for metrics
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
            
            # Resource limits
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 2000m
                memory: 4Gi
            
            # Service monitor selector - this tells Prometheus what to scrape
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
        
        # Grafana configuration
        grafana:
          enabled: true
          adminPassword: admin  # CHANGE THIS! Use a secret in production
          
          # Persistence for dashboards
          persistence:
            enabled: true
            size: 10Gi
          
          # Pre-installed datasources
          datasources:
            datasources.yaml:
              apiVersion: 1
              datasources:
                - name: Prometheus
                  type: prometheus
                  url: http://kube-prometheus-stack-prometheus:9090
                  isDefault: true
                  access: proxy
                - name: Loki
                  type: loki
                  url: http://loki:3100
                  access: proxy
          
          # Enable ingress for external access
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.local  # CHANGE THIS to your domain
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"  # If using cert-manager
          
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        
        # Alertmanager configuration
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
            
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
        
        # Node exporter - collects node metrics
        nodeExporter:
          enabled: true
        
        # Kube-state-metrics - collects Kubernetes object metrics
        kubeStateMetrics:
          enabled: true
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
