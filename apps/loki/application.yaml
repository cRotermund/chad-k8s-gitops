apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  
  source:
    # Grafana Loki for log aggregation
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 6.55.0
    helm:
      values: |
        # Deployment mode - single binary for simplicity
        deploymentMode: SingleBinary
        
        loki:
          auth_enabled: false
          
          commonConfig:
            replication_factor: 1
          
          storage:
            type: 'filesystem'
          
          schemaConfig:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
        
        # Single binary configuration
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 30Gi
          
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        
        # Gateway (nginx) for Loki
        gateway:
          enabled: true
          replicas: 1
        
        # Disable components not needed in single binary mode
        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomCompactor:
          replicas: 0
        bloomGateway:
          replicas: 0
        
        # Enable monitoring
        monitoring:
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
          
          selfMonitoring:
            enabled: false
            grafanaAgent:
              installOperator: false
        
        # Disable test pods
        test:
          enabled: false
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
