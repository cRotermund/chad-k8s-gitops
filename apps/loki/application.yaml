apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    # Grafana Loki for log aggregation
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.12.1
    helm:
      values: |
        # Monolithic mode is the current name for the former single-binary mode.
        deploymentMode: Monolithic
        
        loki:
          auth_enabled: false
          
          commonConfig:
            replication_factor: 1
          
          storage:
            type: 'filesystem'
          
          schemaConfig:
            configs:
              - from: 2024-01-01
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
        
        # Monolithic workload configuration
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 30Gi
          
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        
        # Gateway (nginx) for Loki
        gateway:
          enabled: true
          replicas: 1
        
        # Enable monitoring
        monitoring:
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
          
        # Disable test pods
        test:
          enabled: false
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
