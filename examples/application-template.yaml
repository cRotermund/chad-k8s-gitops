# Example: How to create an application for your own services

# This is a template showing how you might deploy your own applications
# using this infrastructure (ingress, monitoring, logging).

# apiVersion: argoproj.io/v1alpha1
# kind: Application
# metadata:
#   name: my-app
#   namespace: argocd
#   finalizers:
#     - resources-finalizer.argocd.argoproj.io
# spec:
#   project: default  # or create a new project for your apps
#   
#   source:
#     repoURL: https://github.com/yourorg/your-app-repo
#     targetRevision: HEAD
#     path: kubernetes/manifests  # Path to your K8s manifests
#   
#   destination:
#     server: https://kubernetes.default.svc
#     namespace: my-app
#   
#   syncPolicy:
#     automated:
#       prune: true
#       selfHeal: true
#     syncOptions:
#       - CreateNamespace=true

# Example Service with Ingress
---
# apiVersion: v1
# kind: Service
# metadata:
#   name: my-app
#   namespace: my-app
#   labels:
#     app: my-app
# spec:
#   selector:
#     app: my-app
#   ports:
#     - port: 80
#       targetPort: 8080

# Example Ingress
---
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: my-app
#   namespace: my-app
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod  # If using cert-manager
# spec:
#   ingressClassName: traefik  # Uses the cluster's Traefik ingress controller
#   rules:
#     - host: myapp.example.com
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: my-app
#                 port:
#                   number: 80
#   tls:
#     - hosts:
#         - myapp.example.com
#       secretName: myapp-tls

