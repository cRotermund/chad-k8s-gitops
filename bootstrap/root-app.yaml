# Argo CD app-of-apps bootstrap

# Apply the project first, then apply this file once. The root application manages the
# Application resources in apps/*; those child applications manage the Helm releases.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/cRotermund/chad-k8s-gitops
    targetRevision: HEAD
    path: apps
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
