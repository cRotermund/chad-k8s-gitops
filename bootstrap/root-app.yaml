# ArgoCD App-of-Apps Pattern (Optional)

# Instead of applying each application individually, you can use the "App of Apps" pattern
# where one root application manages all other applications.

# Uncomment and use this if you want to manage all apps from a single root application:

# apiVersion: argoproj.io/v1alpha1
# kind: Application
# metadata:
#   name: infrastructure-root
#   namespace: argocd
#   finalizers:
#     - resources-finalizer.argocd.argoproj.io
# spec:
#   project: infrastructure
#   
#   source:
#     repoURL: https://github.com/cRotermund/chad-k8s-gitops
#     targetRevision: HEAD
#     path: apps
#   
#   destination:
#     server: https://kubernetes.default.svc
#     namespace: argocd
#   
#   syncPolicy:
#     automated:
#       prune: true
#       selfHeal: true
#     syncOptions:
#       - CreateNamespace=true

# To use this pattern:
# 1. Uncomment the above
# 2. Apply only this file: kubectl apply -f bootstrap/root-app.yaml
# 3. ArgoCD will automatically discover and deploy all apps in the apps/ directory
